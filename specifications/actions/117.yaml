  Title: Reassess Progress & Update Priorities
  Description: Re-assess on a set cadence; show progress and re-prioritize.
  Slug: 117-reassess-progres
  Implementation Types:
  - null
  Weight: 1.0
  Formula: |-
    * Schedule a cadence to report progress outcomes to key stakeholders.
    * Create reporting to show progress on key outcomes across all maturity initiatives.
    * After successful outcomes are achieved, move on to the next prioritized item in the roadmap.
    * Periodically reevaluate the gap analysis and priority list based on lessons learned and new business goals.
