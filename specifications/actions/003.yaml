  Supplemental Guidance:
  - |-
    With the chosen visibility platform and tooling, FinOps now acts as an administrator of the
    new application. FinOps needs to ensure all stakeholders have access to view their spend and metrics.
    Sometimes the business has policies on who can view financial data. It is up to FinOps to ensure that
    access controls are available to restrict who is able to see dashboards and reports. For example, you
    could set up access so that engineering teams can only view spend allocated to their team versus seeing
    all of the spend for the company. Similarly, it may not be relevant for other departments to see any often
    this spend data, so having controls on who can view the application in general is important.
  - Next, the FinOps team should consider who has the ability to create and share dashboards or other controls
    that are part of the data tooling. This is different from data controls and is more about the functional
    controls over the tooling features themselves.
  - When it comes to data retention, perhaps some of the data is no longer relevant after a certain period of
    time, or at least not too granular of data. FinOps can decide to keep the data stored outside of the tooling
    for historical purposes, but remove it from the tool itself to speed up processing time of calculations and
    of visual rendering of the charts. Some tooling vendors impose their own retention restrictions for the
    data that is represented in the platform.
