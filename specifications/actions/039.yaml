Specification:
  ID: 39
  Title: Run & Refresh Rolling Forecasts
  Description: Run rolling forecasts and determine refresh frequency
  Slug: 39-run-forecasts
  Implementation Types:
  - null
  Weight: 1.0
  Formula: null
  Score Type: threshold
  Scoring:
  - Score: 0
    Condition: None
  - Score: 1
    Condition: Annual
  - Score: 2
    Condition: Quarterly
  - Score: 5
    Condition: Monthly
  - Score: 7
    Condition: Bi-Weekly
  - Score: 8
