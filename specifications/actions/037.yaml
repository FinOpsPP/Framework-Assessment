  References:
  - Name: FinOps Framework - Forecasting
    Link: https://www.finops.org/framework/capabilities/forecasting/
    Comment: the capability definition this action opens, covering purpose, method, horizon, and granularity.
  - Name: FinOps++ Action 39 - Run & Refresh Rolling Forecasts
    Link: https://github.com/FinOpsPP/Framework-Assessment/blob/main/components/actions/039.md
    Comment: |-
      Carries the working definitions of time horizon, frequency, backwards horizon, and granularity that
      item 3 of this action is written against.
  - Name: FinOps KPI - Forecast Accuracy Rate (Spend)
    Link: https://www.finops.org/kpi/forecast-accuracy-rate-spend/
    Comment: the tolerance set in item 6 is expressed against this KPI, and is scored in practice by action 40.
  - Name: FinOps KPI - Forecast Drift Rate
    Link: https://www.finops.org/kpi/forecast-drift-rate/
    Comment: |-
      Drift between successive forecasts is only interpretable when the assumptions in item 5 are recorded,
      since otherwise a changed forecast cannot be told apart from a changed assumption.
  - Name: FinOps++ Score Type - Bucket
    Link: https://github.com/FinOpsPP/Framework-Assessment/blob/main/guidelines/scoring.md#bucket-of-accomplishments
    Comment: an evolution of binary, with more steps to take toward maturity.
  Supplemental Guidance:
  - |
    The items are unordered because an organization can arrive at a documented approach from any direction.
    Most teams already have a method in use and have simply never written down why they chose it.
  - |
    Cadence is deliberately absent from this list. How often a forecast is refreshed is the frequency scored
    by action 39, and scoring it twice would double count a single practice. This action scores the decision
    to have set one, alongside the horizons and granularity that action 39 defines but does not score.
  - |
    More than one forecast is normal and expected. A commitment purchase forecast and an annual budget
    forecast answer different questions over different horizons, and each is scored against these items.
  - |-
    Item 4 is where most reconciliation disputes begin. A forecast that quietly excludes amortized commitment
    cost, credits, or shared cost will not reconcile to an invoice no matter how good the method is.
  Overrides: null
