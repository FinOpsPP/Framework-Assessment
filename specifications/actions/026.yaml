Specification:
  ID: 26
  Title: Record Anomaly Context & Timeline
  Description: Record each anomaly with context, scope, impact, and timeline.
  Slug: 26-record-anomaly
  Implementation Types:
  - null
  Weight: 1.0
  Formula: |-
    * Capture every detected anomaly in a durable record rather than a chat thread or an inbox
    * Record the affected scope: billing account, service, region, and the accountable owner
    * Record the impact as a variance amount in currency, along with the period the variance covers
    * Record the timeline: first occurrence, detection, notification, and resolution timestamps
    * Record the disposition: true positive, expected change, or false positive
    * Retain records so they stay queryable across periods and recurring anomalies can be found

    10*Ceil(x/6)
  Score Type: bucket
  Scoring:
  - Score: 0
    Condition: No items completed
  - Score: 2
    Condition: 1 item completed
  - Score: 4
    Condition: 2 items completed
  - Score: 5
    Condition: 3 items completed
  - Score: 7
    Condition: 4 items completed
  - Score: 9
    Condition: 5 items completed
  - Score: 10
    Condition: 6 items completed
  References:
  - Name: NIST CSF 2.0 - RS.AN-06
    Link: https://doi.org/10.6028/NIST.CSWP.29
    Comment: |-
      "Actions performed during an investigation are recorded, and the records' integrity and provenance are
      preserved." A cost anomaly deserves the same record a security incident gets, for the same reason:
      without it, nothing downstream can be measured or defended.
  - Name: FinOps KPI - Total Unpredicted Variance of Spend
    Link: https://www.finops.org/kpi/total-unpredicted-variance-of-spend/
    Comment: the impact field in item 3 is what makes this KPI computable across a period.
  - Name: FinOps KPI - Anomaly-Detected Cost Avoidance
    Link: https://www.finops.org/kpi/anomaly-detected-cost-avoidance/
    Comment: |-
      Cost avoidance depends on both the variance amount and the duration the anomaly ran, so it cannot be
      claimed without the impact and timeline fields recorded here.
  - Name: FinOps++ Score Type - Bucket
    Link: https://github.com/FinOpsPP/Framework-Assessment/blob/main/guidelines/scoring.md#bucket-of-accomplishments
    Comment: an evolution of binary, with more steps to take toward maturity.
  Supplemental Guidance:
  - |
    The items are unordered because a team can start from any field. They are all about the record itself,
    not about how fast the team responds. Detection, notification, and resolution times are scored by
    action 28, which can only be measured once the timeline in item 4 is being captured.
  - |
    Item 5 matters more than it looks. Without a recorded disposition there is no denominator for a false
    positive rate, which is what action 29 tunes against.
  - |-
    The record does not need a dedicated tool. An existing ticketing or incident system is usually the
    better choice, because it already carries ownership, history, and retention.
  Overrides: null
