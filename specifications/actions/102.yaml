Specification:
  ID: 102
  Title: Define Technology Financial Policies
  Description: Define technology financial policies, the risk each reduces, and who approved them.
  Slug: 102-draft-policies
  Implementation Types:
  - null
  Weight: 1.0
  Formula: |-
    Measured over: every policy in force during the review period. A policy set is small enough to
    enumerate, so items are assessed against each policy rather than as a coverage rate.

    * Policy register (policies in force are listed in one place, each with a named owner and an effective
      date)
    * Risk named (each policy records the financial risk it exists to reduce)
    * Scope stated (each policy records which FinOps Scopes and technology categories it applies to)
    * Approval recorded (each policy records who approved it and at what level of authority)
    * Next review dated (each policy carries the date by which it is reviewed again)

    10*Ceil(x/5)
  Score Type: bucket
  Scoring:
  - Score: 0
    Condition: No items completed
  - Score: 2
    Condition: 1 item completed
  - Score: 4
    Condition: 2 items completed
  - Score: 6
    Condition: 3 items completed
  - Score: 8
    Condition: 4 items completed
  - Score: 10
    Condition: 5 items completed
  References:
  - Name: NIST CSF 2.0 - GV.PO-01
    Link: https://doi.org/10.6028/NIST.CSWP.29
    Comment: |-
      "Policy for managing cybersecurity risks is established based on organizational context,
      cybersecurity strategy, and priorities and is communicated and enforced." Items 2 and 3 are the
      FinOps reading of organizational context and priorities. Communication is scored by action 104 and
      enforcement by action 103, so this action covers establishment only.
  - Name: FinOps Framework - Governance, Policy & Risk Capability
    Link: https://www.finops.org/framework/capabilities/policy-governance/
    Comment: |-
      The capability asks the FinOps Practitioner to define, maintain, and communicate technology policies
      across all FinOps Scopes, and names Risk Register Currency among its measures of success. Item 2 is
      what makes a register of financial risk possible.
  - Name: FinOps++ Score Type - Bucket
    Link: https://github.com/FinOpsPP/Framework-Assessment/blob/main/guidelines/scoring.md#bucket-of-accomplishments
    Comment: an evolution of binary, with more steps to take toward maturity.
  Supplemental Guidance:
  - |
    These are scored as a bucket because you can do them in any order. Approval is often recorded long
    before anyone writes down which scopes a policy covers.
  - |
    No coverage rate applies to the items. A policy set is a list you can print, so an assessor reads each
    policy. A percentage would round hard on a set of three.
  - |
    This action scores the quality of the policy record, not how much of the estate the policies reach. A
    practice with one well-documented policy can score 10 here. Coverage is scored by action 103 through
    guardrail reach, and adherence by action 105.
  Overrides: null
