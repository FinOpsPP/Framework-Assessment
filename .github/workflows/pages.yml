name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v7
      - name: Construct docs
        run: |
          mkdir -p docs/assessments
          mkdir -p docs/components
          mkdir -p docs/guidelines
          
          cp README.md docs/index.md
          cp CONTRIBUTING.md docs/contributing.md
          cp SECURITY.md docs/security.md
          cp assessments/* docs/assessments/
          cp components/* docs/components/
          cp guidelines/* docs/guidelines/

          echo "# Assessments" > docs/assessments/index.md
          echo "" >> docs/assessments/index.md
          ls -1 docs/assessments/**/*.md | while read file; do
            filename=$(basename "$file" .md)
            echo "- [$filename]($filename.md)" >> docs/assessments/index.md
          done

          echo "# Components" > docs/components/index.md
          echo "" >> docs/components/index.md
          ls -1 docs/components/**/*.md | while read file; do
            filename=$(basename "$file" .md)
            echo "- [$filename]($filename.md)" >> docs/components/index.md
          done
          
          cp guidelines/* docs/guidelines/ 2>/dev/null || true
          echo "# Guidelines" > docs/guidelines/index.md
          echo "" >> docs/guidelines/index.md
          ls -1 docs/guidelines/**/*.md | while read file; do
            filename=$(basename "$file" .md)
            echo "- [$filename]($filename.md)" >> docs/guidelines/index.md
          done
      - name: Create Jekyll config
        run: |
          cat > docs/_config.yml << 'EOF'
          title: FinOps++
          description: Home of the Open Source FinOps++ Assessments
          theme: jekyll-theme-cayman
          
          header_pages:
            - index.md
            - contributing.md
            - security.md
            - assessments/index.md
            - components/index.md
            - guidelines/index.md
          EOF
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4