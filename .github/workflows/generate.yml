name: Generate

on:
  pull_request:
    types: [labeled]
    paths:
      - "specifications/**"

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.label.name == 'Generate Components' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install lint and validation dependencies
      run: |
        python -m pip install -e .
    - name: Generate Components
      run: |
        finopspp generate components --specification-type="actions" all
        finopspp generate components --specification-type="capabilities" all
        finopspp generate components --specification-type="domains" all
    - name: Commit and Push Changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m 'Generated Components'
        git push