name: Generate Assessment

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Tag to use to create a release'
        required: true
        type: choice
        option:
          - FinOps++
          - FinOps Foundation

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install finopspp tool for generation
      run: |
        python -m pip install -e .
    - name: Generate Assessments
      run: |
        finopspp generate assessment --profile=${{ inputs.profile }}
    - name: Check for changes
      run: |
        if git diff --exit-code; then
          echo "::set-env name=changes_exist::false"
        else
          echo "::set-env name=changes_exist::true"
        fi
    - name: Commit Changes
      if: env.changes_exist == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Generated Assessment for ${{ inputs.profile }}"
    - name: Create Pull Request
      if: env.changes_exist == 'true'
      uses: peter-evans/create-pull-request@v8
